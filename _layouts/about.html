<!DOCTYPE html>
<html lang="en">
<head>
  {% include head.html %}
</head>
<body>
  {% include small-screen.html %}
  <div class="site-wrap">
    {% include header.html %}
    <main class="main-content">
      <div class="about-grid">
        <div class="about-text">
          <h1 class="about-heading">About</h1>
          <div class="about-body">{{ content }}</div>
        </div>
        {% if page.photo %}
        <div class="about-photo-col">
          <img src="{{ page.photo | relative_url }}" alt="Denzel Otto" class="about-photo">
          {% if page.photo_caption %}
          <div class="about-photo-caption">{{ page.photo_caption }}</div>
          {% endif %}
        </div>
        {% endif %}
      </div>
    </main>
    {% include footer.html %}
  </div>
</body>
</html>
